name: Liberty Rompler - Build macOS AU VST3 Standalone

on:
  push:
    branches: [main]
    paths:
      - 'assets/rompler-source-v0.1.tar.xz'
      - 'assets/ui-v02/**'
      - 'assets/ui-v03/**'
      - 'assets/ui-v04/**'
      - 'assets/ui-v05/**'
      - 'assets/ui-v06/**'
      - '.github/workflows/build-rompler.yml'
      - 'scripts/fix_v06_header.py'
      - 'tests/test_v06_header_contract.py'
      - 'scripts/install_mac.command'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rompler-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS Apple Silicon - UI v0.6 / AU + VST3 + Standalone
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout Liberty Rompler
        uses: actions/checkout@v4

      - name: Verify and unpack prototype source
        shell: bash
        run: |
          set -euo pipefail
          echo '0da09c77c326780c5f972a45984be0f345ff3a39639c340192e04c2a33476e9e  assets/rompler-source-v0.1.tar.xz' | shasum -a 256 --check
          tar -xJf assets/rompler-source-v0.1.tar.xz
          test -f CMakeLists.txt
          test -f Source/PluginProcessor.cpp
          test -f tools/make_demo_banks.py

      - name: Apply new Nexus-style Liberty UI, audio filter and regression checks
        shell: bash
        run: |
          set -euo pipefail
          cat assets/ui-v02/part-{1..5}.b64 | base64 -D > /tmp/liberty-ui-v02.tar.xz
          echo '3cfe2791987fd1a9e4b51abb60696b24b24da4ef09d45a9ce93e59652d9fe061  /tmp/liberty-ui-v02.tar.xz' | shasum -a 256 --check
          tar -xJf /tmp/liberty-ui-v02.tar.xz
          test -f tests/test_ui_regression.py
          test -f Source/PluginEditor.cpp
          test -f Source/SampleEngine.h

      - name: Apply UI v0.3 tabs, effects, modulation and full-width keyboard
        shell: bash
        run: |
          set -euo pipefail
          cat assets/ui-v03/part-{1..4}.b64 | base64 -D > /tmp/liberty-ui-v03.patch.xz
          echo '2048ee0ec90574a07c52fa738a907f7e1570cbf9f373e9305aa0ee6147041c94  /tmp/liberty-ui-v03.patch.xz' | shasum -a 256 --check
          xz -dc /tmp/liberty-ui-v03.patch.xz > /tmp/liberty-ui-v03.patch
          patch -p1 < /tmp/liberty-ui-v03.patch
          test -f Source/PluginEditor.cpp
          test -f Source/PluginProcessor.cpp
          test -f tests/test_ui_regression.py

      - name: Apply v0.4 Delay Distortion + full French-text fixes
        shell: bash
        run: |
          set -euo pipefail
          cat assets/ui-v04/part-{1..3}.b64 | base64 -D > /tmp/liberty-ui-v04.patch.xz
          echo '37fce78e5a9eb0dfdb4c6106b25540ad26f1e5f93276ed51d467f47e07950d1d  /tmp/liberty-ui-v04.patch.xz' | shasum -a 256 --check
          xz -dc /tmp/liberty-ui-v04.patch.xz > /tmp/liberty-ui-v04.patch
          patch -p1 < /tmp/liberty-ui-v04.patch
          test -f tools/audit_ui_text.py
          test -f tests/test_ui_v04.py

      - name: Apply v0.5 modulators, three-band EQ and compressor
        shell: bash
        run: |
          set -euo pipefail
          cat assets/ui-v05/part-{1..5}.b64 | base64 -D > /tmp/liberty-ui-v05.patch.xz
          echo '103afbbefa19e00f88128e6f21d2980dd6cd7862f410ca09f4987d2cf683fc57  /tmp/liberty-ui-v05.patch.xz' | shasum -a 256 --check
          xz -dc /tmp/liberty-ui-v05.patch.xz > /tmp/liberty-ui-v05.patch
          patch -p1 < /tmp/liberty-ui-v05.patch
          test -f tests/test_ui_v05.py
          test -f Source/PluginEditor.cpp
          test -f Source/PluginProcessor.cpp

      - name: Apply v0.6 four-layer multisample engine and UI
        shell: bash
        run: |
          set -euo pipefail
          cat assets/ui-v06/part-{1..6}.b64 | base64 -D > /tmp/liberty-ui-v06.patch.xz
          echo 'fdea4e597422beba2f9dbf2a902e53a81e204d579dca786211d1583c8dfd1f1a  /tmp/liberty-ui-v06.patch.xz' | shasum -a 256 --check
          xz -dc /tmp/liberty-ui-v06.patch.xz > /tmp/liberty-ui-v06.patch
          patch -p1 < /tmp/liberty-ui-v06.patch
          python3 scripts/fix_v06_header.py
          test -f tests/test_layers_v06.py
          test -f Source/SampleEngine.cpp
          test -f Source/BankLibrary.cpp

      - name: Configure Python for demo bank generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate bank files, Unicode and no-overlap geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy
          python3 tools/make_demo_banks.py
          python3 tools/validate_banks.py
          python3 tools/audit_ui_text.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          test -f Banks/Factory-Starter/manifest.json
          test -f Banks/Expansion-Demo/manifest.json

      - name: Download JUCE 8.0.10
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: '8.0.10'
          path: JUCE
          fetch-depth: 1

      - name: Configure CMake for arm64
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Xcode \
            -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Compile AU, VST3 and standalone
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release \
            --target LibertyRompler_AU LibertyRompler_VST3 LibertyRompler_Standalone \
            --parallel 3

      - name: Package UI v0.6, installer and both demo banks
        shell: bash
        run: |
          set -euo pipefail
          target="dist/Liberty-Rompler-macOS-arm64-UI-v0.6"
          mkdir -p "$target"
          app="$(find build/LibertyRompler_artefacts -type d -name '*.app' -print -quit)"
          vst="$(find build/LibertyRompler_artefacts -type d -name '*.vst3' -print -quit)"
          au="$(find build/LibertyRompler_artefacts -type d -name '*.component' -print -quit)"
          test -n "$app" && test -n "$vst" && test -n "$au"
          ditto "$app" "$target/Liberty Rompler.app"
          ditto "$vst" "$target/Liberty Rompler.vst3"
          ditto "$au" "$target/Liberty Rompler.component"
          ditto Banks "$target/Banks"
          cp scripts/install_mac.command "$target/INSTALLER_MAC.command"
          chmod +x "$target/INSTALLER_MAC.command"
          for bundle in "$target/Liberty Rompler.app" "$target/Liberty Rompler.vst3" "$target/Liberty Rompler.component"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --verbose "$bundle"
          done
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Liberty-Rompler-macOS-arm64-UI-v0.6 Liberty-Rompler-macOS-arm64-UI-v0.6.zip)
          hdiutil create -volname "Liberty Rompler UI v0.6" \
            -srcfolder "$target" -ov -format UDZO \
            dist/Liberty-Rompler-macOS-arm64-UI-v0.6.dmg
          test -s dist/Liberty-Rompler-macOS-arm64-UI-v0.6.zip
          test -s dist/Liberty-Rompler-macOS-arm64-UI-v0.6.dmg

      - name: Upload downloadable macOS builds
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Rompler-macOS-arm64-UI-v0.6-AU-VST3-Standalone
          path: |
            dist/Liberty-Rompler-macOS-arm64-UI-v0.6.zip
            dist/Liberty-Rompler-macOS-arm64-UI-v0.6.dmg
          if-no-files-found: error
          retention-days: 30
